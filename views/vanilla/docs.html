<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Investiture Documentation - Architecture and Usage Guide">
  <title>Documentation - Investiture</title>

  <!-- Design System Tokens (CSS Custom Properties) -->
  <link rel="stylesheet" href="../../design-system/tokens/tokens.css">

  <!-- Compiled Styles -->
  <link rel="stylesheet" href="styles.css">

  <style>
    /* Docs-specific styles */
    .docs-nav {
      display: flex;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-xl);
      flex-wrap: wrap;
    }

    .docs-nav__link {
      padding: var(--spacing-xs) var(--spacing-md);
      background: var(--color-background-secondary);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      text-decoration: none;
      transition: all var(--transition-fast);
    }

    .docs-nav__link:hover {
      background: var(--color-background-tertiary);
      color: var(--color-text-primary);
      text-decoration: none;
    }

    .docs-nav__link--active {
      background: var(--color-accent-primary);
      color: var(--color-background-primary);
      border-color: var(--color-accent-primary);
    }

    .faq-section {
      margin-bottom: var(--spacing-xxl);
      scroll-margin-top: var(--spacing-xl);
    }

    .faq-section__title {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-accent-primary);
      margin-bottom: var(--spacing-lg);
      padding-bottom: var(--spacing-sm);
      border-bottom: 1px solid var(--color-border-default);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-to-top {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-normal);
      color: var(--color-text-muted);
    }

    .back-to-top:hover {
      color: var(--color-accent-primary);
    }

    .docs-section {
      margin-bottom: var(--spacing-xl);
    }

    .docs-section__title {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-md);
    }

    .docs-section__content {
      color: var(--color-text-secondary);
      line-height: var(--line-height-relaxed);
    }

    .docs-section__content code {
      background: var(--color-background-tertiary);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      font-family: var(--font-family-mono);
      font-size: var(--font-size-sm);
    }

    .docs-section__content pre {
      background: var(--color-background-tertiary);
      padding: var(--spacing-md);
      border-radius: var(--radius-sm);
      overflow-x: auto;
      margin: var(--spacing-md) 0;
    }

    .docs-section__content pre code {
      background: none;
      padding: 0;
    }

    .docs-section__content ul,
    .docs-section__content ol {
      padding-left: var(--spacing-lg);
      margin: var(--spacing-sm) 0;
    }

    .docs-section__content li {
      margin-bottom: var(--spacing-xs);
    }

    .docs-section__content ul li {
      list-style: disc;
    }

    .docs-section__content ol li {
      list-style: decimal;
    }

    .docs-section__content p {
      margin-bottom: var(--spacing-sm);
    }

    .architecture-diagram {
      background: var(--color-background-tertiary);
      padding: var(--spacing-lg);
      border-radius: var(--radius-md);
      font-family: var(--font-family-mono);
      font-size: var(--font-size-sm);
      white-space: pre;
      overflow-x: auto;
      margin: var(--spacing-lg) 0;
    }
  </style>
</head>
<body>
  <!-- Skip Link for Accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- App Shell -->
  <div id="app" class="app">
    <!-- Header -->
    <header class="header">
      <div class="header__brand">
        <a href="./" style="text-decoration: none;">
          <h1 class="header__title">Investiture</h1>
        </a>
        <span class="header__tagline">Documentation</span>
      </div>
      <nav class="header__nav">
        <a href="starter.html" class="button button--secondary button--small">Starter Page</a>
        <a href="getting-started.html" class="button button--secondary button--small">Get Started</a>
        <a href="./" class="button button--secondary button--small">Home</a>
        <a href="https://github.com/erikaflowers/investiture" target="_blank" rel="noopener" class="button button--secondary button--small">GitHub</a>
      </nav>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="main">
      <!-- Navigation -->
      <nav class="docs-nav" id="docs-nav">
        <!-- Generated from sections -->
      </nav>

      <!-- Content -->
      <div id="docs-content">
        <p style="color: var(--color-text-muted);">Loading documentation...</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p class="footer__text">
        <em>"The most important step a person can take is the next one."</em>
        — Dalinar Kholin
      </p>
      <p class="footer__credit">
        "Investiture" borrowed with gratitude from <a href="https://www.brandonsanderson.com/" target="_blank" rel="noopener">Brandon Sanderson's</a> Cosmere universe.
      </p>
    </footer>
  </div>

  <!-- Load Documentation -->
  <script type="module" src="docs.js"></script>
</body>
</html>
